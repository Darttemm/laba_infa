name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      
      - name: Run shellcheck
        run: shellcheck -e SC1091 scripts/main.sh tests/test_main.sh

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Download shunit2
        run: curl -sSL https://raw.githubusercontent.com/kward/shunit2/master/shunit2 -o tests/shunit2 && chmod +x tests/shunit2
      
      - name: Run tests
        run: bash tests/test_main.sh

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Syntax check (build)
        run: bash -n scripts/main.sh && echo "Build passed"
